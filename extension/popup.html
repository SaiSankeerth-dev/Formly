<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seva Saarthi Government Assistant</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: white;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
    }
    .sub {
      font-size: 10px;
      color: #34d399;
      font-weight: 600;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      margin-bottom: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main:active {
      transform: scale(0.98);
    }
    .btn-sec {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sec:hover {
      background: #334155;
    }
    .shortcut {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🤖</div>
    <div>
      <div class="title">Seva Saarthi Universal Assistant</div>
      <div class="sub">● Vault Connected (Rahul Kumar)</div>
    </div>
  </div>

  <div class="desc">
    Works on <strong>Protean PAN Card</strong>, <strong>Scholarships (NSP)</strong>, <strong>PMAY</strong>, and all Indian government portals.
  </div>

  <button id="btn-autofill" class="btn-main">
    <span>⚡</span>
    <span>AUTOFILL THIS PAGE</span>
  </button>

  <button id="btn-open-formly" class="btn-sec">
    Open Seva Saarthi Web Dashboard
  </button>

  <div class="shortcut">
    Tip: Press <strong>Alt + Shift + F</strong> to autofill instantly!
  </div>

  <script src="popup.js"></script>
</body>
</html>
